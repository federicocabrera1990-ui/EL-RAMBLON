<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/iniciar_sesion.css">
    <title>Iniciar sesión</title>
</head>
<body>
    

<section>

  <!-- Caja general que centra todo en la pantalla -->
  <div class="caja-general">
 
    <!-- Tarjeta blanca del formulario -->
    <div class="panel-registro">
 
      <!-- Icono del candado -->
      <div class="candado">
        <img class="icon-lock" src="../../css/img/login.svg" alt="Iniciar sesion">

      </div>
 
      <!-- Título -->
      <h1>Inicia sesión ahora</h1>
 
    
      <form id="g">
          <div class="form-datos">
            <label>Correo Electronico</label>
            <input type="text" name="email" placeholder="Introduce tu correo" required>
          </div>

          <div class="form-datos">
            <label>contrasena</label>
            <input type="password" name="contrasena" placeholder="Introduce tu contrasena" required>
          </div>
            <input type="submit" class="btn-acceso">
      </form>
 
      <!-- Link registro -->
      <p class="registro-link">
        <a href="registrarse.html">¿No tienes una cuenta?</a>
      </p>
 
      <!-- Volver al inicio -->
      <p class="volver-inicio">
        Volver a la página principal de <a href="../index.html">El Ramblón</a>
      </p>
 
    </div>
  </div>
 
</section>

<div id="asd"></div>
<script src="../../js/iniciar_session.js"></script>
</body>
</html>
